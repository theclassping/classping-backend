[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-aggregator"
version = "0.1.1"
description = "Provider-neutral payment aggregator: pay-in billing, cancel, refund, payouts and fees, with DANA and DOKU providers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "cryptography>=41",
]

[tool.setuptools.packages.find]
where = ["src"]
