[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-aggregator"
version = "0.1.0"
description = "Provider-neutral payment aggregator: pay-in billing, payouts and fees, with a Rintisan provider."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "cryptography>=41",
]

[tool.setuptools.packages.find]
where = ["src"]
