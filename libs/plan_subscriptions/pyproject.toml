[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-plan-subscriptions"
version = "0.1.0"
description = "Reusable Django subscriptions: plans with database-defined features, add-ons, trials, invoices and entitlement checks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "python-dateutil>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plan_subscriptions = ["migrations/*.py"]
