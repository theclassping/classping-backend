name: Deploy staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_API: https://api.render.com/v1

    steps:
      - name: Check configuration
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::Set the RENDER_API_KEY secret and RENDER_SERVICE_ID variable on the staging environment"
            exit 1
          fi

      - name: Trigger Render deploy
        id: trigger
        run: |
          # Pin the deploy to the commit that passed CI.
          response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\": \"${GITHUB_SHA}\"}" \
            "${RENDER_API}/services/${RENDER_SERVICE_ID}/deploys")
          deploy_id=$(echo "$response" | jq -r '.id')
          echo "Started Render deploy ${deploy_id} for ${GITHUB_SHA}"
          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          while true; do
            status=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "${RENDER_API}/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" | jq -r '.status')
            echo "Render deploy status: ${status}"
            case "$status" in
              live)
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ${DEPLOY_ID} ended with status ${status}"
                exit 1 ;;
            esac
            sleep 15
          done
