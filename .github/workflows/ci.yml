name: CI

on:
  pull_request:
    branches: [dev, main, "release/**"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: classping_test
          POSTGRES_USER: classping
          POSTGRES_PASSWORD: classping
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classping -d classping_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://classping:classping@localhost:5432/classping_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
