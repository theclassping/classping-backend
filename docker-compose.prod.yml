name: classping-backend-production

x-app: &app
  image: classping-backend-production:local
  build:
    context: .
    dockerfile: Dockerfile.production
  env_file:
    - .env.production
  environment:
    DJANGO_SETTINGS_MODULE: config.settings_production
    DJANGO_DEBUG: "False"
    DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: queued and delayed Celery tasks survive a Redis restart.
    # noeviction: never drop keys (Celery queues) when memory is full.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  release:
    <<: *app
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    command: >-
      sh -c "python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --access-logfile - --error-logfile -"
    ports:
      - "127.0.0.1:${PRODUCTION_PORT:-8001}:8000"
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 5

  # Celery worker + beat in one process. Run exactly ONE instance (beat).
  scheduler:
    <<: *app
    restart: unless-stopped
    command:
      - celery
      - -A
      - config
      - worker
      - -B
      - --concurrency=2
      - --max-tasks-per-child=100
      - --schedule=/app/var/celerybeat/schedule
      - --loglevel=info
    volumes:
      # Beat's last-run times survive redeploys, so a job missed while the
      # container was down runs once on start.
      - celerybeat_data:/app/var/celerybeat
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
