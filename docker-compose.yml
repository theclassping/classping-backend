services:
  db:
    image: postgres:17
    container_name: classping-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: classping
      POSTGRES_USER: classping
      POSTGRES_PASSWORD: classping
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: classping-redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classping-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://classping:classping@db:5432/classping
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-local}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classping-scheduler
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py run_scheduler"
    environment:
      - DATABASE_URL=postgres://classping:classping@db:5432/classping
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-local}
    depends_on:
      - db
      - redis
      - web
    volumes:
      - .:/app

volumes:
  postgres_data:
