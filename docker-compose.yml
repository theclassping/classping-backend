services:
  db:
    image: postgres:17
    container_name: classping-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: classping
      POSTGRES_USER: classping
      POSTGRES_PASSWORD: classping
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: